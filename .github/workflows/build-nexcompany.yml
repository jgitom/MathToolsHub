name: Build NexCompany AI desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "nexcompany-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/nexcompany-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/nexcompany-desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: nexcompany-windows
          path: apps/nexcompany-desktop/dist/*
          if-no-files-found: error
