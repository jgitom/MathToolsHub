name: Build Asset Management desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "asset-management-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/asset-management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/asset-management/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: asset-management-${{ matrix.artifact }}
          path: apps/asset-management/dist/*
          if-no-files-found: error
