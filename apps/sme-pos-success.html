<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f2747"><title>SME POS Download | MathToolsHub</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#172033;background:#f4f7fa;font-family:Inter,"Segoe UI",Arial,sans-serif}.card{width:min(620px,100%);padding:36px;border:1px solid #dbe3ec;border-radius:16px;background:#fff;box-shadow:0 20px 55px #0f27471c;text-align:center}.mark{width:64px;height:64px;display:grid;place-items:center;margin:auto;border-radius:16px;color:#fff;background:#0f2747;font-size:26px;font-weight:900}h1{color:#0f2747;font-size:clamp(2rem,6vw,3rem)}p{color:#64748b;line-height:1.65}.button{display:grid;place-items:center;min-height:48px;margin-top:22px;padding:12px;border-radius:10px;color:#fff;background:#2563eb;font-weight:850;text-decoration:none}.button[hidden]{display:none}.back{display:inline-block;margin-top:18px;color:#2563eb;font-weight:750;text-decoration:none}.error{color:#b42318}</style></head>
<body><main class="card"><div class="mark">🛒</div><h1>Verifying your payment</h1><p id="status">Please wait while Stripe confirms your purchase.</p><a class="button" id="license" hidden>Download licence file</a><a class="button" id="download" hidden>Download Windows installer</a><p id="instructions" hidden>Install the application, then open <strong>Settings → Licence &amp; Packages</strong>, paste the licence JSON into the activation box and press <strong>Activate</strong>.</p><a class="back" href="sme-pos-download.html">Return to SME POS</a></main>
<script src="../supabase-config.js"></script><script>
const status=document.getElementById("status"),download=document.getElementById("download"),license=document.getElementById("license"),instructions=document.getElementById("instructions"),sessionId=new URLSearchParams(location.search).get("session_id");
(async()=>{try{if(!/^cs_(test|live)_[A-Za-z0-9_]+$/.test(sessionId||""))throw new Error("Missing or invalid Checkout Session ID.");const config=window.MATHTOOLSHUB_SUPABASE,response=await fetch(config.url+"/functions/v1/sme-pos-download",{method:"POST",headers:{apikey:config.publishableKey,"content-type":"application/json"},body:JSON.stringify({sessionId,platform:"windows"})}),body=await response.json();if(!response.ok)throw new Error(body.error||"Unable to verify payment.");if(!body.license)throw new Error("Stripe confirmed payment, but licence generation failed.");status.textContent=`Payment confirmed. Your ${Number(body.itemLimit).toLocaleString()}-item licence is ready.`;license.href=URL.createObjectURL(new Blob([JSON.stringify(body.license,null,2)],{type:"application/json"}));license.download=`MathToolsHub-SME-POS-${Number(body.itemLimit).toLocaleString("en-US")}-items.mthlic`;license.hidden=false;download.href=body.downloadUrl;download.hidden=false;instructions.hidden=false}catch(error){status.textContent=error.message+" If you just paid, wait a few seconds and refresh this page.";status.classList.add("error")}})();
