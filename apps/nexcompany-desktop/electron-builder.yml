appId: com.mathtoolshub.nexcompany
productName: NexCompany AI
copyright: Copyright © 2026 NexCompany

directories:
  buildResources: build
  output: dist

files:
  - "index.html"
  - "css/**/*"
  - "js/**/*"
  - "vendor/**/*"
  - "assets/**/*"
  - "manifest.webmanifest"
  - "sw.js"
  - "electron/**"
  - "!dist/**"
  - "!node_modules/**"
  - "!README*.md"

asar: true

# ---------- Windows installer (.exe) ----------
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: NexCompanyAI

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: NexCompany AI
  artifactName: "NexCompany-Setup-${version}.${ext}"
  deleteAppDataOnUninstall: false
  license: build/license.txt
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png

# ---------- macOS (optional) ----------
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
