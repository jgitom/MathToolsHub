<!DOCTYPE html><html lang='ms'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Empire Kota</title><style>
:root{--bg:#efe7d5;--ink:#1f2a26;--panel:#fffaf0;--green:#1f6d4f;--gold:#d3a52f;--red:#b43b3b;--blue:#2b6cb0}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#f8f2e5,#e5dac2);color:var(--ink);overflow-x:hidden}header{background:#183d30;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header h1{margin:0;color:#f3cf6b}.back{color:#fff;text-decoration:none;font-weight:900}.back:hover{text-decoration:underline}.site-language-slot{display:flex;align-items:center;justify-content:center;flex:1;min-width:150px}.header-copy{white-space:nowrap}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}.secondary{background:#5b564c}.wrap{width:100%;max-width:1250px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.boardwrap,.side{min-width:0;background:var(--panel);border:1px solid #cfbf9d;border-radius:18px;box-shadow:0 10px 28px #0002}.boardwrap{padding:14px;overflow:hidden}.board-stage{position:relative;margin:auto;transition:width .2s ease,height .2s ease}#board{width:700px;height:700px;margin:0;position:absolute;left:0;top:0;transform-origin:top left;background:#e8e2c7;border:5px solid #5d4a2c}.cell{position:absolute;width:100px;height:100px;border:1px solid #6b5c43;background:#fffdf5;padding:5px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;justify-content:space-between;text-align:center;overflow:hidden;overflow-wrap:anywhere}.cell strong{display:block;max-width:100%}.corner{background:#ead9ae;font-weight:900}.band{height:13px;min-height:13px;margin:-5px -5px 4px}.owner{font-size:9px;font-weight:900}.price{font-weight:800}.tokens{display:flex;justify-content:center;gap:3px;flex-wrap:wrap}.token{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;border:2px solid #fff}.p1{background:#2b6cb0}.p2{background:#c53030}.center{position:absolute;left:100px;top:100px;width:500px;height:500px;display:grid;place-items:center;text-align:center;padding:40px}.center h2{font-size:52px;margin:0;color:#1f6d4f;transform:rotate(-15deg)}.side{padding:16px;display:flex;flex-direction:column;gap:12px}.player{padding:12px;border-radius:12px;background:#eee5d3;border:2px solid transparent}.player.active{border-color:var(--green);background:#dceee6}.player h3{margin:0 0 5px}.difficulty{display:grid;gap:6px;padding:10px 12px;background:#e7ddc8;border-radius:10px;font-weight:800}.difficulty select{width:100%;padding:9px;border:1px solid #9c8d70;border-radius:8px;background:#fffaf0;color:var(--ink);font-weight:700}.money{font-size:24px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dice{font-size:48px;text-align:center}#log{height:210px;overflow:auto;background:#efe7d5;border-radius:10px;padding:10px;font-size:13px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:999}.modalbox{background:#fffaf0;padding:24px;border-radius:18px;max-width:420px;width:90%;text-align:center}.buttons{display:flex;gap:8px;justify-content:center}@media(max-width:980px){header{display:grid;grid-template-columns:auto 1fr;align-items:center}.back{justify-self:start}header h1{justify-self:end;text-align:right}.header-copy{grid-column:1/-1;white-space:normal;text-align:center}.site-language-slot{grid-column:1/-1;width:100%;min-width:0}.site-language-slot .mth-universal-language-picker,.site-language-slot #languageSelect{position:static!important;width:100%!important;max-width:none!important}.wrap{grid-template-columns:minmax(0,1fr);padding:12px}.side{order:-1}.boardwrap{max-width:100%;padding:10px}}@media(max-width:430px){header{padding:12px}.back,header h1{font-size:.9rem}.actions{grid-template-columns:1fr}.center h2{font-size:44px}}
</style></head><body><header><a class='back' href='../'>← Semua Permainan</a><h1>EMPIRE KOTA</h1><div id='siteLanguageSlot' class='site-language-slot'></div><div class='header-copy'>Permainan Hartanah & Strategi</div></header><div class='wrap'><section class='boardwrap'><div id='boardStage' class='board-stage'><div id='board'><div class='center'><div><h2>EMPIRE<br>KOTA</h2><p>Bina aset • Kutip sewa • Jadi taikun terakhir</p></div></div></div></div></section><aside class='side'><div id='p1box' class='player active'><h3>Pemain 1 🔵</h3><div class='money' id='p1money'></div><div id='p1props'></div></div><div id='p2box' class='player'><h3>Komputer 🔴</h3><div class='money' id='p2money'></div><div id='p2props'></div></div><label class='difficulty'>Tahap Komputer<select id='difficultySelect'><option value='1'>Tahap 1 — Pemula</option><option value='2'>Tahap 2 — Mudah</option><option value='3' selected>Tahap 3 — Sederhana</option><option value='4'>Tahap 4 — Sukar</option><option value='5'>Tahap 5 — Pakar</option></select></label><div class='dice' id='dice'>🎲</div><div class='actions'><button id='rollBtn'>Baling Dadu</button><button id='endBtn' class='secondary'>Tamat Giliran</button></div><button id='newBtn' class='secondary'>Permainan Baru</button><div id='status'></div><div id='log'></div></aside></div><div id='modal' class='modal'><div class='modalbox'><h2 id='modalTitle'></h2><p id='modalText'></p><div class='buttons' id='modalButtons'></div></div></div><script>
const colors=['#8dd3c7','#ffffb3','#bebada','#fb8072','#80b1d3','#fdb462','#b3de69','#fccde5'];
const names=['MULA','Taman Damai','Kad Peluang','Pekan Baru','Cukai Bandar','Teluk Indah','Bukit Emas','Dana Komuniti','Seri Mutiara','Bandar Utara','PUSAT TAHANAN','Taman Teknologi','Kad Peluang','Marina Bayu','Sentral Kota','Cukai Aset','Kota Harmoni','Dana Komuniti','Bukit Perdana','Metro Selatan','REHAT PERCUMA','Pelabuhan Raya','Kad Peluang','Dataran Niaga','Kota Digital','Yuran Lesen','Taman Inovasi','Dana Komuniti','Bandar Megah','Pusat Global','PERGI TAHANAN','Kota Angkasa','Kad Peluang','Emerald Heights','Borneo Central','Cukai Premium','Menara Emas','Dana Komuniti','Kota Diraja','Mahkota Avenue'];
const spaces=names.map((name,i)=>{if(i===0)return{type:'start',name};if(i===10)return{type:'jail',name};if(i===20)return{type:'free',name};if(i===30)return{type:'goto',name};if([2,7,12,17,22,27,32,37].includes(i))return{type:'event',name};if([4,15,25,35].includes(i))return{type:'tax',name,amount:[100,150,100,200][[4,15,25,35].indexOf(i)]};let idx=i-[2,7,12,17,22,27,32,37].filter(x=>x<i).length-[4,15,25,35].filter(x=>x<i).length-(i>10?1:0)-(i>20?1:0)-(i>30?1:0)-1;let price=100+Math.max(0,idx)*20;return{type:'property',name,price,rent:Math.round(price*.2),c:Math.min(7,Math.floor(idx/4))}});
let players,owners,current,rolled,gameOver,computerLevel=3;
function pos(i){if(i<=10)return{left:(10-i)*60,top:600};if(i<=20)return{left:0,top:(20-i)*60};if(i<=30)return{left:(i-20)*60,top:0};return{left:600,top:(i-30)*60}}
function build(){let b=document.getElementById('board');for(let i=0;i<40;i++){let s=spaces[i],d=document.createElement('div');d.className='cell'+([0,10,20,30].includes(i)?' corner':'');let p=pos(i);d.style.left=p.left+'px';d.style.top=p.top+'px';if((i>0&&i<10)||(i>20&&i<30)){d.style.width='60px'}if((i>10&&i<20)||(i>30&&i<40)){d.style.height='60px'}d.id='space'+i;let band=s.type==='property'?`<div class='band' style='background:${colors[s.c]}'></div>`:'';let extra=s.type==='property'?`<div class='price'>RM${s.price}</div><div class='owner' id='owner${i}'></div>`:s.type==='tax'?`<div class='price'>Bayar RM${s.amount}</div>`:s.type==='event'?'<div>🎴</div>':'';d.innerHTML=band+`<strong>${s.name}</strong>${extra}<div class='tokens' id='tokens${i}'></div>`;b.appendChild(d)}}
function log(m){let l=document.getElementById('log');l.innerHTML='<div>• '+m+'</div>'+l.innerHTML}
function modal(t,x,bs){document.getElementById('modalTitle').textContent=t;document.getElementById('modalText').textContent=x;let box=document.getElementById('modalButtons');box.innerHTML='';bs.forEach(b=>{let z=document.createElement('button');z.textContent=b.label;if(b.secondary)z.className='secondary';z.onclick=()=>{document.getElementById('modal').style.display='none';b.action()};box.appendChild(z)});document.getElementById('modal').style.display='grid'}
function render(){players.forEach((p,i)=>{document.getElementById('p'+(i+1)+'money').textContent='RM'+p.money;document.getElementById('p'+(i+1)+'props').textContent=p.props.length+' hartanah';document.getElementById('p'+(i+1)+'box').classList.toggle('active',i===current)});for(let i=0;i<40;i++){let t=document.getElementById('tokens'+i);t.innerHTML='';players.forEach((p,pi)=>{if(p.pos===i){let x=document.createElement('div');x.className='token p'+(pi+1);x.textContent=pi+1;t.appendChild(x)}});if(spaces[i].type==='property')document.getElementById('owner'+i).textContent=owners[i]===null?'':'Milik P'+(owners[i]+1)}document.getElementById('status').textContent=gameOver?'Permainan tamat.':`Giliran ${players[current].name}${rolled?' — tamatkan giliran.':' — baling dadu.'}`;document.getElementById('rollBtn').disabled=rolled||gameOver||current===1;document.getElementById('endBtn').disabled=!rolled||gameOver||current===1}
function bankrupt(){let p=players[current];if(p.money<0){gameOver=true;let w=players[1-current];modal('Bankrap',`${p.name} bankrap. ${w.name} menang!`,[{label:'Permainan Baru',action:newGame}]);log(`${p.name} bankrap. ${w.name} menang.`)}render()}
function eventCard(){let cards=[['Bonus projek berjaya. Terima RM150.',150],['Kos pembaikan kecemasan. Bayar RM100.',-100],['Dividen pelaburan. Terima RM200.',200],['Denda lesen perniagaan. Bayar RM75.',-75],['Geran pembangunan. Terima RM120.',120],['Insurans aset. Bayar RM90.',-90]];let c=cards[Math.floor(Math.random()*cards.length)],p=players[current];p.money+=c[1];log(p.name+': '+c[0]);bankrupt()}
function shouldComputerBuy(p,s){let plans=[null,{reserve:700,chance:.35},{reserve:550,chance:.5},{reserve:400,chance:.68},{reserve:250,chance:.85},{reserve:100,chance:1}],plan=plans[computerLevel];return p.money-s.price>=plan.reserve&&Math.random()<plan.chance}
function resolve(){let p=players[current],s=spaces[p.pos],idx=p.pos;if(s.type==='property'){if(owners[idx]===null){if(current===1){if(shouldComputerBuy(p,s))buy(idx);else log(`${p.name} tidak membeli ${s.name}.`)}else modal(s.name,`Harga RM${s.price}. Sewa RM${s.rent}. Mahu beli?`,[{label:'Beli',action:()=>buy(idx)},{label:'Tidak',secondary:true,action:render}])}else if(owners[idx]!==current){p.money-=s.rent;players[owners[idx]].money+=s.rent;log(`${p.name} membayar sewa RM${s.rent}.`);bankrupt()}}else if(s.type==='tax'){p.money-=s.amount;log(`${p.name} membayar ${s.name} RM${s.amount}.`);bankrupt()}else if(s.type==='event')eventCard();else if(s.type==='goto'){p.pos=10;p.money-=50;log(`${p.name} dihantar ke Pusat Tahanan dan membayar RM50.`);bankrupt()}else if(s.type==='free'){p.money+=50;log(`${p.name} menerima bonus rehat RM50.`)}}
function buy(i){let p=players[current],s=spaces[i];if(p.money>=s.price){p.money-=s.price;p.props.push(i);owners[i]=current;log(`${p.name} membeli ${s.name} pada RM${s.price}.`)}else log('Wang tidak mencukupi.');render()}
function roll(){if(rolled||gameOver)return;let d=Math.floor(Math.random()*6)+1;document.getElementById('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];let p=players[current],old=p.pos;p.pos=(p.pos+d)%40;if(old+d>=40){p.money+=200;log(`${p.name} melepasi MULA dan menerima RM200.`)}rolled=true;log(`${p.name} membaling ${d} dan tiba di ${spaces[p.pos].name}.`);resolve();render()}
function computerTurn(){if(gameOver||current!==1)return;roll();setTimeout(()=>{if(!gameOver&&current===1)endTurn()},900)}
function endTurn(){if(!rolled||gameOver)return;current=1-current;rolled=false;document.getElementById('dice').textContent='🎲';render();if(current===1)setTimeout(computerTurn,700)}
function newGame(){computerLevel=Number(document.getElementById('difficultySelect').value);players=[{name:'Pemain 1',money:1500,pos:0,props:[]},{name:'Komputer',money:1500,pos:0,props:[]}];owners=Array(40).fill(null);current=0;rolled=false;gameOver=false;document.getElementById('modal').style.display='none';document.getElementById('log').innerHTML='';log('Permainan baru dimulakan.');render()}
function fitBoard(){let wrap=document.querySelector('.boardwrap'),stage=document.getElementById('boardStage'),board=document.getElementById('board'),available=Math.max(280,wrap.clientWidth-28),scale=Math.min(1.18,available/700);board.style.transform=`scale(${scale})`;stage.style.width=700*scale+'px';stage.style.height=700*scale+'px'}
document.getElementById('rollBtn').onclick=roll;document.getElementById('endBtn').onclick=endTurn;document.getElementById('newBtn').onclick=newGame;document.getElementById('difficultySelect').onchange=e=>{computerLevel=Number(e.target.value);log(`Tahap komputer ditukar kepada ${computerLevel}.`)};build();newGame();fitBoard();window.addEventListener('resize',fitBoard);
</script><script src='../../supabase-config.js'></script><script type='module' src='../../subscription-access.js'></script><script src='../../universal-language.js'></script></body></html>
